<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statistics | Media Survey</title>
  <link rel="icon" type="image/x-icon" href="/media-survey/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="admin-layout">
  <div class="container-fluid">
    <div class="row">
      <aside class="col-lg-2 admin-sidebar">
        <div class="fw-bold fs-5 mb-4"><span class="brand-mark">MS</span>Admin</div>
        <nav class="nav flex-lg-column">
          <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
          <a class="nav-link" href="responses.html"><i class="bi bi-table me-2"></i>Responses</a>
          <a class="nav-link active" href="statistics.html"><i class="bi bi-pie-chart me-2"></i>Statistics</a>
          <a class="nav-link" href="../index.html"><i class="bi bi-house me-2"></i>Public</a>
          <button class="nav-link border-0 text-start bg-transparent" id="logoutBtn"><i class="bi bi-box-arrow-left me-2"></i>Logout</button>
        </nav>
      </aside>
      <main class="col-lg-10 admin-content">
        <div class="mb-4">
          <h1 class="fw-bold mb-1">Statistics Page</h1>
          <p class="muted mb-0">Visualisasi data survey menggunakan Chart.js.</p>
        </div>

        <div class="row g-3">
          <div class="col-xl-6">
            <div class="data-panel chart-box">
              <h2 class="h5 fw-bold">Favorite Platforms</h2>
              <canvas id="platformChart"></canvas>
            </div>
          </div>
          <div class="col-xl-6">
            <div class="data-panel chart-box">
              <h2 class="h5 fw-bold">Daily Usage Duration</h2>
              <canvas id="durationChart"></canvas>
            </div>
          </div>
          <div class="col-xl-6">
            <div class="data-panel chart-box">
              <h2 class="h5 fw-bold">Gender Distribution</h2>
              <canvas id="genderChart"></canvas>
            </div>
          </div>
          <div class="col-xl-6">
            <div class="data-panel chart-box">
              <h2 class="h5 fw-bold">Life Impact</h2>
              <canvas id="impactChart"></canvas>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabaseClient.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/statistics.js"></script>
</body>
</html>
