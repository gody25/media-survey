<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responses | Media Survey</title>
  <link rel="icon" type="image/x-icon" href="/media-survey/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="admin-layout">
  <div class="container-fluid">
    <div class="row">
      <aside class="col-lg-2 admin-sidebar">
        <div class="fw-bold fs-5 mb-4"><span class="brand-mark">MS</span>Admin</div>
        <nav class="nav flex-lg-column">
          <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
          <a class="nav-link active" href="responses.html"><i class="bi bi-table me-2"></i>Responses</a>
          <a class="nav-link" href="statistics.html"><i class="bi bi-pie-chart me-2"></i>Statistics</a>
          <a class="nav-link" href="../index.html"><i class="bi bi-house me-2"></i>Public</a>
          <button class="nav-link border-0 text-start bg-transparent" id="logoutBtn"><i class="bi bi-box-arrow-left me-2"></i>Logout</button>
        </nav>
      </aside>
      <main class="col-lg-10 admin-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
          <div>
            <h1 class="fw-bold mb-1">Survey Management</h1>
            <p class="muted mb-0">View, edit, delete, search, paginate, and export responses.</p>
          </div>
          <button class="btn btn-primary" id="exportBtn"><i class="bi bi-filetype-csv me-2"></i>Export CSV</button>
        </div>

        <div class="data-panel">
          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input class="form-control" id="searchInput" placeholder="Search by name, occupation, platform, impact...">
              </div>
            </div>
            <div class="col-md-3">
              <select class="form-select" id="platformFilter"></select>
            </div>
            <div class="col-md-3 text-md-end">
              <span class="muted small" id="resultInfo">0 results</span>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Age</th>
                  <th>Gender</th>
                  <th>Occupation</th>
                  <th>Platform</th>
                  <th>Duration</th>
                  <th>Impact</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="responsesTable">
                <tr><td colspan="8"><div class="loader mx-auto"></div></td></tr>
              </tbody>
            </table>
          </div>

          <nav class="d-flex justify-content-end">
            <ul class="pagination mb-0" id="pagination"></ul>
          </nav>
        </div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <form class="modal-content" id="editForm">
        <div class="modal-header">
          <h2 class="modal-title h5">Edit Response</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit_id">
          <input type="hidden" id="edit_responden_id">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Name</label><input class="form-control" id="edit_nama"></div>
            <div class="col-md-3"><label class="form-label required">Age</label><input class="form-control" id="edit_umur" type="number" min="10" max="100" required></div>
            <div class="col-md-3"><label class="form-label required">Gender</label><select class="form-select" id="edit_jenis_kelamin" required></select></div>
            <div class="col-md-6"><label class="form-label required">Occupation</label><input class="form-control" id="edit_pekerjaan" required></div>
            <div class="col-md-6"><label class="form-label required">Platform</label><select class="form-select" id="edit_platform_utama" required></select></div>
            <div class="col-md-6"><label class="form-label required">Duration</label><select class="form-select" id="edit_durasi_harian" required></select></div>
            <div class="col-md-6"><label class="form-label required">Purpose</label><select class="form-select" id="edit_tujuan_utama" required></select></div>
            <div class="col-md-6"><label class="form-label required">Frequency</label><select class="form-select" id="edit_frekuensi" required></select></div>
            <div class="col-md-6"><label class="form-label required">Information benefit</label><select class="form-select" id="edit_bantu_informasi" required></select></div>
            <div class="col-md-6"><label class="form-label required">Productivity impact</label><select class="form-select" id="edit_ganggu_produktivitas" required></select></div>
            <div class="col-md-6"><label class="form-label required">Life impact</label><select class="form-select" id="edit_pengaruh_kehidupan" required></select></div>
            <div class="col-12"><label class="form-label">Suggestions</label><textarea class="form-control" id="edit_saran" rows="3"></textarea></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveEditBtn">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabaseClient.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/responses.js"></script>
</body>
</html>
