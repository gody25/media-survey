<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Media Survey</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="admin-layout">
  <div class="container-fluid">
    <div class="row">
      <aside class="col-lg-2 admin-sidebar">
        <div class="fw-bold fs-5 mb-4"><span class="brand-mark">MS</span>Admin</div>
        <nav class="nav flex-lg-column">
          <a class="nav-link active" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
          <a class="nav-link" href="responses.html"><i class="bi bi-table me-2"></i>Responses</a>
          <a class="nav-link" href="statistics.html"><i class="bi bi-pie-chart me-2"></i>Statistics</a>
          <a class="nav-link" href="../index.html"><i class="bi bi-house me-2"></i>Public</a>
          <button class="nav-link border-0 text-start bg-transparent" id="logoutBtn"><i class="bi bi-box-arrow-left me-2"></i>Logout</button>
        </nav>
      </aside>
      <main class="col-lg-10 admin-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
          <div>
            <h1 class="fw-bold mb-1">Dashboard</h1>
            <p class="muted mb-0">Ringkasan responden dan jawaban survey terbaru.</p>
          </div>
          <a class="btn btn-primary" href="responses.html"><i class="bi bi-download me-2"></i>Manage Data</a>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-6 col-xl-3"><div class="stat-tile"><div class="muted small">Total Respondents</div><div class="stat-value" id="totalRespondents">0</div></div></div>
          <div class="col-md-6 col-xl-3"><div class="stat-tile"><div class="muted small">Male Respondents</div><div class="stat-value" id="maleRespondents">0</div></div></div>
          <div class="col-md-6 col-xl-3"><div class="stat-tile"><div class="muted small">Female Respondents</div><div class="stat-value" id="femaleRespondents">0</div></div></div>
          <div class="col-md-6 col-xl-3"><div class="stat-tile"><div class="muted small">Most Popular Platform</div><div class="stat-value fs-4" id="popularPlatform">-</div></div></div>
        </div>

        <div class="data-panel">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 fw-bold mb-0">Recent Responses</h2>
            <span class="badge badge-soft">Latest 6</span>
          </div>
          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Gender</th>
                  <th>Platform</th>
                  <th>Duration</th>
                  <th>Life Impact</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="recentResponses">
                <tr><td colspan="6"><div class="loader mx-auto"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabaseClient.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/dashboard.js"></script>
</body>
</html>
