<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Media Survey</title>
  <link rel="icon" type="image/x-icon" href="/media-survey/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="container">
    <div class="auth-panel">
      <a class="navbar-brand fw-bold d-inline-flex align-items-center mb-4" href="index.html"><span class="brand-mark">MS</span>Media Survey</a>
      <h1 class="h3 fw-bold">Login Admin</h1>
      <p class="muted">Masuk untuk mengelola data survey.</p>
      <form id="loginForm" class="mt-4">
        <div class="mb-3">
          <label class="form-label required" for="email">Email</label>
          <input class="form-control" id="email" type="email" required autocomplete="email">
        </div>
        <div class="mb-3">
          <label class="form-label required" for="password">Password</label>
          <input class="form-control" id="password" type="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary w-100" id="loginBtn" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Login</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabaseClient.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
